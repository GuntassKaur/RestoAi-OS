name: RestoAI OS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- Backend CI ---
  backend-status:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Backend Diagnostic
      run: |
        cd backend
        # Basic syntax check to ensure codebase integrity
        python -m py_compile main.py

  # --- Frontend CI ---
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install
    - name: Test Frontend Build
      run: |
        cd frontend
        # Verify that Next.js can build without errors
        # (This avoids pushing broken code to production)
        npm run build
      env:
        # Mocking variables for build time
        NEXT_PUBLIC_API_URL: https://api.restoai.com

  # --- Deployment Instruction ---
  # Note: Actual deployment is usually automated via Vercel for Frontend
  # and Railway/Render for Backend. This job ensures both parts are ready.
  deploy-sync:
    needs: [backend-status, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Notify Deployment
      run: echo "Code is stable and ready for production deployment!"
